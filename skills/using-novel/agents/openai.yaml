interface:
  display_name: "小说技能入口"
  short_description: "把中文网文任务分流到建书脚手架、大纲、剧情、人物、正文场景写作或共享规则技能，并在当前技能完成后继续检查需要补齐的设定与落盘；凡是写剧情、扩写、续写、润色、改写或推进剧情，都必须强制检查书籍目录相关文件是否需要同步。"
  default_prompt: "使用 $using-novel 判断我的小说任务该走哪个技能；如果我要先创建单本书工作区，也请自动分流。无论是大纲、剧情、人物还是写剧情、续写、扩写、润色、改写、根据剧情扩写正文，当前技能完成后都继续强制检查书籍目录相关文件是否需要补齐或同步，包括人物卡、关系卡、剧情节点、伏笔记录、canon、summary.md、context.md 与其他架构目录；正文类请求写完后还要自动检查人物一致性、首次出场是否突兀，以及明显转换是否铺垫到位。"
