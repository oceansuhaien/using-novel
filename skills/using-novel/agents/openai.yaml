interface:
  display_name: "小说技能入口"
  short_description: "把中文网文任务分流到建书脚手架、大纲、剧情、人物、正文场景写作或共享规则技能，并在当前技能完成后继续检查需要补齐的设定与落盘；若是已落盘正文返工，入口会先建立轻量版本分支、生成影响面分析并按受影响文件包推进，不边改边回灌主线。"
  default_prompt: "使用 $using-novel 判断我的小说任务该走哪个技能；如果我要先创建单本书工作区，也请自动分流。无论是大纲、剧情、人物还是写剧情、续写、扩写、润色、改写、根据剧情扩写正文，当前技能完成后都继续强制检查书籍目录相关文件是否需要补齐或同步，包括人物卡、关系卡、剧情节点、伏笔记录、canon、summary.md、context.md 与其他架构目录；进入任务前先读取偏好记忆里的作者级稳定规则和当前书的单书级稳定规则，本轮新归纳内容先记为候选经验，不能自动升级为稳定规则。若用户是在返工已落盘正文，先进入轻量版本分支，让主线冻结仅读，先做影响面分析，再按受影响文件包推进；未整包确认前不回灌主线，整包确认后再一次性合并回主线。正文类请求写完后还要自动检查人物一致性、首次出场是否突兀，以及明显转换是否铺垫到位，并要求正文子技能留下章节级执行证据。只有在高置信且能说明违反了哪条设定、哪段上下文或哪类高概率毒点时，才允许直接拦截；如果只是模糊感觉不对，则只能提醒。"
